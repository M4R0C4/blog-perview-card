<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Lobster&family=Outfit:wght@100..900&family=Roboto+Slab:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Blog preview card</title>

<link rel="stylesheet" href="style.css">
    </style>
  </head>
  <body>

  <main>
    <div id="card">
      <img src="assets/images/illustration-article.svg" alt="drawers" class="card__img">
      <div id="card__content">
        <div id="card__tag">
          <p>Learning</p>
        </div>
        <div id="card__title">
          <p id="date-post">Published <time datetime="2023-12-21">21 Dec 2023</time></p>
          </div>
          <div class="title">
            <h1><abbr title="HyperText Markup Language">HTML</abbr> & <abbr title="Cascading Style Sheets">CSS</abbr> foundations</h1>
          </div>
               
          <div id="card__text">
  <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
</div>

      </div>
      <div id="card__author">
        <img src="assets/images/image-avatar.webp" alt="Greg Hooper">
        <p>Greg Hooper</p>
      </div>
    </div>
  </main>
    
    <!-- <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Your Name Here</a>. -->
    </div>
  </body>
</html>
